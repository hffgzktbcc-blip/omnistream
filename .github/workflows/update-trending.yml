name: Dynamic Trending Titles Auto-Scout

on:
  schedule:
    # Runs every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-trending:
    name: Fetch & Refresh Dynamic Feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Run Trending Auto-Scout
        run: node scripts/updateTrending.js

      - name: Commit & Push Dynamic Feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/trending.json
          if git diff --staged --quiet; then
            echo "No changes in trending titles."
          else
            git commit -m "chore(data): auto-scout fresh dynamic trending titles [skip ci]"
            git push origin main
          fi
