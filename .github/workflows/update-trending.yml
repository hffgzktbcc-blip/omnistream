name: Dynamic Content Scout & Stream Health Benchmark

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-trending:
    name: Sync Dynamic Feeds & Stream Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Run Dynamic Scout & Health Benchmark
        run: node scripts/updateTrending.js

      - name: Commit & Push Dynamic Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/trending.json public/data/stream-health.json
          if git diff --staged --quiet; then
            echo "No changes in dynamic feeds or stream health."
          else
            git commit -m "chore(data): sync dynamic feeds & stream health telemetry [skip ci]"
            git push origin main
          fi
