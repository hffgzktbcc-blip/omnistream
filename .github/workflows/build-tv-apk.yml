name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android TV APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OmniStream-AndroidTV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniStream-AndroidTV-APK
          path: output/OmniStream-AndroidTV.apk
          retention-days: 30

      - name: Release Android TV APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "OmniStream Android TV & Mobile Release v1.0.3 (0ms Native Bundling, Focus Overhaul, 2026 Mirrors & Shelf Suite)"
          body: "Official Android TV & Mobile APK for OmniStream with 0ms local asset performance, high-visibility D-pad remote focus, verified 2026 streaming mirrors, unified cross-media watch history, mobile bottom navigation, and full Audiobook Shelf Suite."
          files: output/OmniStream-AndroidTV.apk
          make_latest: true
          overwrite: true
